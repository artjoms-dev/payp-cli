services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: payp_test
      POSTGRES_USER: payp
      POSTGRES_PASSWORD: payp_dev
    ports:
      - "5432:5432"
    volumes:
      - ./tests/seed.sql:/docker-entrypoint-initdb.d/seed.sql
      - pgdata:/var/lib/postgresql/data

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: payp_test
      MYSQL_USER: payp
      MYSQL_PASSWORD: payp_dev
      MYSQL_ROOT_PASSWORD: root_dev
    ports:
      - "3306:3306"
    volumes:
      - ./tests/seed_mysql.sql:/docker-entrypoint-initdb.d/seed.sql
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: payp_dev
      APP_USER: payp
      APP_USER_PASSWORD: payp_dev
      ORACLE_DATABASE: payp_test
    ports:
      - "1521:1521"
    volumes:
      - ./tests/seed_oracle.sql:/container-entrypoint-initdb.d/seed.sql
      - oracledata:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  mysqldata:
  oracledata:
