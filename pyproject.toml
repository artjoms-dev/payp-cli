[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "payp"
version = "0.1.0"
description = "AI-powered CLI for data engineers — Claude Code for databases"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Artjoms Zelenkevics", email = "a.zelenkevich@icloud.com" },
    { name = "Viktors Afanasjevs", email = "afanasjewww@gmail.com" },
]
keywords = ["database", "ai", "cli", "data-engineering", "postgresql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Database",
]

dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "litellm>=1.0",
    "psycopg[binary]>=3.1",
    "aiomysql>=0.2.0",
    "oracledb>=2.0",
    "sqlglot>=20.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tomli>=2.0;python_version<'3.11'",
    "tomli-w>=1.0",
    "plotext>=5.0",
    "plotille>=5.0",
    "textual>=0.40",
    "mcp>=1.0",
    "openpyxl>=3.1",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
mempalace = ["mempalace>=0.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-Pygments",
    "types-openpyxl",
    "types-PyMySQL",
]

[project.scripts]
payp = "payp.cli:app_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["plotille", "aiomysql", "pyarrow.*", "mempalace.*"]
ignore_missing_imports = true
